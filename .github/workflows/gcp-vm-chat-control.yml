name: GCP VM Chat control
run-name: "Chat VM control @ ${{ github.sha }}"

on:
  push:
    branches:
      - vm-control
    paths:
      - control/command.json

permissions:
  id-token: write

concurrency:
  group: gcp-azl-android-arm64-01-lifecycle
  cancel-in-progress: false

jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - id: command
        name: Validate committed lifecycle command
        shell: bash
        run: |
          set -euo pipefail

          command_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/control/command.json"
          command_json="$(curl --silent --show-error --fail-with-body \
            --connect-timeout 10 --max-time 30 \
            "$command_url")"

          jq -e '
            . as $d |
            type == "object" and
            (keys | sort) == ["action", "nonce"] and
            ($d.action | type == "string") and
            ((["describe", "start", "stop"] | index($d.action)) != null) and
            ($d.nonce | type == "string") and
            ($d.nonce | test("^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"))
          ' <<<"$command_json" >/dev/null

          action="$(jq -r '.action' <<<"$command_json")"
          nonce="$(jq -r '.nonce' <<<"$command_json")"
          echo "action=${action}" >> "$GITHUB_OUTPUT"
          echo "nonce=${nonce}" >> "$GITHUB_OUTPUT"
          echo "Validated action=${action} nonce=${nonce}"

      - id: auth
        name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: project-97e3d26a-3ba2-4579-b03
          workload_identity_provider: projects/137432928351/locations/global/workloadIdentityPools/alcloud-github/providers/alcloud-chat-control
          service_account: alcloud-vm-lifecycle@project-97e3d26a-3ba2-4579-b03.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/compute
          create_credentials_file: false
          export_environment_variables: false

      - name: Execute constrained lifecycle operation
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          ACTION: ${{ steps.command.outputs.action }}
          REQUEST_ID: ${{ steps.command.outputs.nonce }}
        run: |
          set -euo pipefail

          readonly PROJECT_ID='project-97e3d26a-3ba2-4579-b03'
          readonly ZONE='us-central1-a'
          readonly INSTANCE='azl-android-arm64-01'
          readonly BASE_URL="https://compute.googleapis.com/compute/v1/projects/${PROJECT_ID}/zones/${ZONE}/instances/${INSTANCE}"

          get_instance() {
            curl --silent --show-error --fail-with-body \
              --connect-timeout 10 --max-time 45 \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              "$BASE_URL"
          }

          print_status() {
            jq '{
              name,
              status,
              zone: (.zone | split("/")[-1]),
              lastStartTimestamp,
              lastStopTimestamp,
              scheduling: {
                maxRunDuration: .scheduling.maxRunDuration,
                instanceTerminationAction: .scheduling.instanceTerminationAction,
                gracefulShutdown: .scheduling.gracefulShutdown,
                automaticRestart: .scheduling.automaticRestart,
                onHostMaintenance: .scheduling.onHostMaintenance,
                provisioningModel: .scheduling.provisioningModel
              }
            }'
          }

          current_json="$(get_instance)"
          current_status="$(jq -r '.status' <<<"$current_json")"
          echo "Current VM status: ${current_status}"

          case "$ACTION" in
            describe)
              print_status <<<"$current_json"
              ;;

            start)
              if [[ "$current_status" == 'RUNNING' ]]; then
                echo 'VM is already RUNNING; no lifecycle request sent.'
                print_status <<<"$current_json"
                exit 0
              fi
              if [[ "$current_status" != 'TERMINATED' ]]; then
                echo "Refusing start from unexpected state: ${current_status}" >&2
                exit 1
              fi

              response="$(curl --silent --show-error --fail-with-body \
                --connect-timeout 10 --max-time 45 \
                -X POST \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                "${BASE_URL}/start?requestId=${REQUEST_ID}")"
              echo 'Start request accepted:'
              jq '{name,status,operationType,targetLink}' <<<"$response"
              sleep 2
              echo 'VM status after request submission:'
              get_instance | print_status
              ;;

            stop)
              if [[ "$current_status" == 'TERMINATED' ]]; then
                echo 'VM is already TERMINATED; no lifecycle request sent.'
                print_status <<<"$current_json"
                exit 0
              fi
              if [[ "$current_status" != 'RUNNING' ]]; then
                echo "Refusing stop from unexpected state: ${current_status}" >&2
                exit 1
              fi

              # Deliberately omit noGracefulShutdown so Compute Engine honors
              # the VM's configured graceful-shutdown policy.
              response="$(curl --silent --show-error --fail-with-body \
                --connect-timeout 10 --max-time 45 \
                -X POST \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                "${BASE_URL}/stop?requestId=${REQUEST_ID}")"
              echo 'Stop request accepted:'
              jq '{name,status,operationType,targetLink}' <<<"$response"
              sleep 2
              echo 'VM status after request submission:'
              get_instance | print_status
              ;;

            *)
              echo "Unsupported action: ${ACTION}" >&2
              exit 2
              ;;
          esac
