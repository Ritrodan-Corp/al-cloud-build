name: GCP VM Chat control
run-name: "Chat control/log intake @ ${{ github.sha }}"

on:
  push:
    branches:
      - vm-control
    paths:
      - control/command.json
      - log-inbox/submissions/**

permissions:
  contents: read
  id-token: write

jobs:
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      lifecycle: ${{ steps.detect.outputs.lifecycle }}
      log_intake: ${{ steps.detect.outputs.log_intake }}
    steps:
      - id: detect
        name: Detect changed control surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          event = json.load(open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8'))
          paths = set()
          for commit in event.get('commits', []):
              for key in ('added', 'modified', 'removed'):
                  paths.update(commit.get(key, []) or [])
          lifecycle = 'control/command.json' in paths
          log_intake = any(p.startswith('log-inbox/submissions/') for p in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"lifecycle={'true' if lifecycle else 'false'}\n")
              f.write(f"log_intake={'true' if log_intake else 'false'}\n")
          print(f'lifecycle={lifecycle} log_intake={log_intake}')
          PY

  lifecycle:
    needs: detect
    if: needs.detect.outputs.lifecycle == 'true'
    concurrency:
      group: gcp-azl-android-arm64-01-lifecycle
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - id: command
        name: Validate committed lifecycle command
        shell: bash
        run: |
          set -euo pipefail

          command_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/control/command.json"
          command_json="$(curl --silent --show-error --fail-with-body \
            --connect-timeout 10 --max-time 30 \
            "$command_url")"

          jq -e '
            . as $d |
            type == "object" and
            (keys | sort) == ["action", "nonce"] and
            ($d.action | type == "string") and
            ((["describe", "start", "stop"] | index($d.action)) != null) and
            ($d.nonce | type == "string") and
            ($d.nonce | test("^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"))
          ' <<<"$command_json" >/dev/null

          action="$(jq -r '.action' <<<"$command_json")"
          nonce="$(jq -r '.nonce' <<<"$command_json")"
          echo "action=${action}" >> "$GITHUB_OUTPUT"
          echo "nonce=${nonce}" >> "$GITHUB_OUTPUT"
          echo "Validated action=${action} nonce=${nonce}"

      - id: auth
        name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: project-97e3d26a-3ba2-4579-b03
          workload_identity_provider: projects/137432928351/locations/global/workloadIdentityPools/alcloud-github/providers/alcloud-chat-control
          service_account: alcloud-vm-lifecycle@project-97e3d26a-3ba2-4579-b03.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/compute
          create_credentials_file: false
          export_environment_variables: false

      - name: Execute constrained lifecycle operation
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          ACTION: ${{ steps.command.outputs.action }}
          REQUEST_ID: ${{ steps.command.outputs.nonce }}
        run: |
          set -euo pipefail

          readonly PROJECT_ID='project-97e3d26a-3ba2-4579-b03'
          readonly ZONE='us-central1-a'
          readonly INSTANCE='azl-android-arm64-01'
          readonly BASE_URL="https://compute.googleapis.com/compute/v1/projects/${PROJECT_ID}/zones/${ZONE}/instances/${INSTANCE}"

          get_instance() {
            curl --silent --show-error --fail-with-body \
              --connect-timeout 10 --max-time 45 \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              "$BASE_URL"
          }

          print_status() {
            jq '{
              name,
              status,
              zone: (.zone | split("/")[-1]),
              lastStartTimestamp,
              lastStopTimestamp,
              scheduling: {
                maxRunDuration: .scheduling.maxRunDuration,
                instanceTerminationAction: .scheduling.instanceTerminationAction,
                gracefulShutdown: .scheduling.gracefulShutdown,
                automaticRestart: .scheduling.automaticRestart,
                onHostMaintenance: .scheduling.onHostMaintenance,
                provisioningModel: .scheduling.provisioningModel
              }
            }'
          }

          wait_for_status() {
            local target="$1"
            local timeout_seconds="$2"
            local deadline=$((SECONDS + timeout_seconds))
            local json status
            while (( SECONDS < deadline )); do
              json="$(get_instance)"
              status="$(jq -r '.status' <<<"$json")"
              echo "Waiting for ${target}; current status=${status}"
              if [[ "$status" == "$target" ]]; then
                print_status <<<"$json"
                return 0
              fi
              sleep 10
            done
            json="$(get_instance)"
            status="$(jq -r '.status' <<<"$json")"
            echo "Timed out waiting for ${target}; final status=${status}" >&2
            print_status <<<"$json" >&2
            return 1
          }

          wait_for_stop_transition() {
            local deadline=$((SECONDS + 60))
            local json status
            while (( SECONDS < deadline )); do
              json="$(get_instance)"
              status="$(jq -r '.status' <<<"$json")"
              echo "Waiting for graceful-stop acknowledgement; current status=${status}"
              case "$status" in
                PENDING_STOP|STOPPING|TERMINATED)
                  print_status <<<"$json"
                  return 0
                  ;;
              esac
              sleep 5
            done
            json="$(get_instance)"
            status="$(jq -r '.status' <<<"$json")"
            echo "Stop request was accepted but no stop-state transition was observed within 60s; final status=${status}" >&2
            print_status <<<"$json" >&2
            return 1
          }

          current_json="$(get_instance)"
          current_status="$(jq -r '.status' <<<"$current_json")"
          echo "Current VM status: ${current_status}"

          case "$ACTION" in
            describe)
              print_status <<<"$current_json"
              ;;

            start)
              case "$current_status" in
                RUNNING)
                  echo 'VM is already RUNNING; no lifecycle request sent.'
                  print_status <<<"$current_json"
                  echo 'START_READY: VM is RUNNING.'
                  exit 0
                  ;;
                PENDING_STOP|STOPPING)
                  echo 'A graceful stop is already in progress. Waiting for TERMINATED before starting.'
                  wait_for_status TERMINATED 720
                  ;;
                STAGING|PROVISIONING)
                  echo 'A start is already in progress. Waiting for RUNNING instead of sending another request.'
                  wait_for_status RUNNING 300
                  echo 'START_READY: VM is RUNNING.'
                  exit 0
                  ;;
                TERMINATED)
                  ;;
                *)
                  echo "Refusing start from unexpected state: ${current_status}" >&2
                  exit 1
                  ;;
              esac

              response="$(curl --silent --show-error --fail-with-body \
                --connect-timeout 10 --max-time 45 \
                -X POST \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                "${BASE_URL}/start?requestId=${REQUEST_ID}")"
              echo 'Start request accepted:'
              jq '{name,status,operationType,targetLink}' <<<"$response"
              wait_for_status RUNNING 300
              echo 'START_READY: VM is RUNNING.'
              ;;

            stop)
              case "$current_status" in
                TERMINATED)
                  echo 'VM is already TERMINATED; no lifecycle request sent.'
                  print_status <<<"$current_json"
                  echo 'STOP_READY: VM is TERMINATED.'
                  exit 0
                  ;;
                PENDING_STOP|STOPPING)
                  echo 'Graceful shutdown is already in progress; no duplicate stop request sent.'
                  print_status <<<"$current_json"
                  echo 'STOP_READY: shutdown is already in progress; TERMINATED need not be awaited in this run.'
                  exit 0
                  ;;
                RUNNING)
                  ;;
                *)
                  echo "Refusing stop from unexpected state: ${current_status}" >&2
                  exit 1
                  ;;
              esac

              response="$(curl --silent --show-error --fail-with-body \
                --connect-timeout 10 --max-time 45 \
                -X POST \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                "${BASE_URL}/stop?requestId=${REQUEST_ID}")"
              echo 'Stop request accepted:'
              jq '{name,status,operationType,targetLink}' <<<"$response"
              wait_for_stop_transition
              echo 'STOP_READY: graceful shutdown acknowledged; TERMINATED need not be awaited in this run.'
              ;;

            *)
              echo "Unsupported action: ${ACTION}" >&2
              exit 2
              ;;
          esac

  log_drain:
    needs: detect
    if: needs.detect.outputs.log_intake == 'true'
    concurrency:
      group: al-cloud-log-drain
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: auth
        name: Authenticate centralized log writer with Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: project-97e3d26a-3ba2-4579-b03
          workload_identity_provider: projects/137432928351/locations/global/workloadIdentityPools/alcloud-github/providers/alcloud-chat-control
          service_account: alcloud-vm-lifecycle@project-97e3d26a-3ba2-4579-b03.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/documents
          create_credentials_file: true
          export_environment_variables: true

      - name: Install append dependencies
        run: python3 -m pip install --disable-pip-version-check google-auth requests

      - name: Drain immutable report submissions in Git commit order
        shell: bash
        env:
          RAW_LOG_DOC_ID: 1s9VbzdPnA7nm-ogDP4X9gt2bghQ4mcKTVNVk1AiAiWg
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(log-inbox/submissions/*.txt)
          if (( ${#files[@]} == 0 )); then
            echo 'No immutable log submissions found.'
            exit 0
          fi

          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          for file in "${files[@]}"; do
            add_commit="$(git log --diff-filter=A --format='%H' -- "$file" | tail -n 1)"
            [[ -n "$add_commit" ]] || { echo "Cannot find creation commit for $file" >&2; exit 1; }
            ordinal="$(git rev-list --count "$add_commit")"
            printf '%012d\t%s\t%s\n' "$ordinal" "$add_commit" "$file" >> "$tmp"
          done

          sort -n -k1,1 -k3,3 "$tmp" | while IFS=$'\t' read -r ordinal add_commit file; do
            body="$(cat "$file")"
            [[ -n "${body//[[:space:]]/}" ]] || { echo "Empty report: $file" >&2; exit 1; }
            created_at="$(git show -s --format='%cI' "$add_commit")"
            submission_name="${file#log-inbox/submissions/}"
            submission_name="${submission_name%.txt}"
            step="$(printf '%s\n' "$body" | sed -n '/[^[:space:]]/ { s/^[[:space:]]*//; s/[[:space:]]*$//; p; q; }' | cut -c1-120)"
            [[ -n "$step" ]] || step='Agent operational report'

            echo "Draining $file (order=$ordinal)"
            entry_id="$({ printf '%s' "$body"; } | python3 tools/al-log-append.py \
              --document-id "$RAW_LOG_DOC_ID" \
              --workstream 'Agent operational report' \
              --step "$step" \
              --action 'Submitted through the immutable GitHub log inbox.' \
              --result-stdin \
              --next 'Continue from this report; later substantive findings use a new immutable submission.' \
              --timestamp "$created_at" \
              --submission-id "github-file:${submission_name}")"
            echo "$file -> $entry_id"
          done
