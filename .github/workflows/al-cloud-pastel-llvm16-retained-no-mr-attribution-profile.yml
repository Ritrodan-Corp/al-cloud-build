name: AL Cloud Pastel LLVM16 Retained No MR Attribution Profile

on:
  push:
    branches:
      - pastel-llvm16-sampler-attribution-20260927
    paths:
      - .github/workflows/al-cloud-pastel-llvm16-retained-no-mr-attribution-profile.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PASTEL_VARIANT: aot-neoverse-n1-llvm16-retained-no-mr
      PASTEL_PROFILE_JIT: "1"
      PASTEL_PROFILE_SAMPLER_STATE_NAMES: "1"
      PASTEL_EXTRA_SWAP_GB: "8"
      PASTEL_DIAGNOSTICS: "1"

    steps:
      - name: Checkout attribution source
        uses: actions/checkout@v4

      - name: Validate build script syntax
        shell: bash
        run: bash -n experiments/160-swiftshader-perf/build-android-control.sh

      - name: Build retained-no-MR attribution profiler
        run: GITHUB_WORKSPACE="$PWD" bash experiments/160-swiftshader-perf/build-android-control.sh

      - name: Record attribution provenance
        if: success()
        shell: bash
        run: |
          OUT=experiments/160-swiftshader-perf/out-control
          {
            echo "experiment=llvm16-retained-no-mr-sampler-state-attribution"
            echo "pastel_variant=aot-neoverse-n1-llvm16-retained-no-mr"
            echo "pipeline_chain=SROA -> EarlyCSE -> Reassociate -> NewGVN -> DSE -> IndVarSimplify -> InstCombine"
            echo "production_renderer_sha=1b2aed583c4430630296049d7a14b3eca51d20bfa0a73520ba73cdb98f4160fa"
            echo "source_branch=pastel-llvm16-sampler-attribution-20260927"
            echo "source_commit=${GITHUB_SHA}"
            echo "attribution_builder_commit=3316d0c977c3d99cda48e4b08565cc16a0199080"
            echo "profile=LLVM16 PerfJIT jitdump with exact sampler-state routine names"
          } > "$OUT/llvm16-retained-no-mr-attribution-provenance.txt"

      - name: Upload attribution profiling artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pastel-prof-retained-no-mr-attribution-${{ github.sha }}
          path: experiments/160-swiftshader-perf/out-control/
          if-no-files-found: error
          retention-days: 7
