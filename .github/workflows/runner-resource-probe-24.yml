name: GitHub hosted runner resource probe 24

on:
  push:
    branches:
      - vm-control
    paths:
      - .github/workflows/runner-resource-probe-24.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe hosted runner resources
        shell: bash
        run: |
          set -euxo pipefail
          date -u
          nproc
          free -h
          df -h /
          uname -a
          ulimit -a
          for f in memory.current memory.peak memory.max memory.swap.current memory.swap.max memory.events; do
            if [ -r "/sys/fs/cgroup/$f" ]; then
              echo "== $f =="
              cat "/sys/fs/cgroup/$f"
            fi
          done
          grep -E '^(MemTotal|MemAvailable|SwapTotal|SwapFree):' /proc/meminfo
