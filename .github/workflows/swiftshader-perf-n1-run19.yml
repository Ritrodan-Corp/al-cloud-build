name: SwiftShader Android 14 Pastel N1 run 19

on:
  push:
    branches:
      - vm-control
    paths:
      - .github/workflows/swiftshader-perf-n1-run19.yml

permissions:
  contents: read

jobs:
  build-n1:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PASTEL_VARIANT: jit-neoverse-n1
    steps:
      - uses: actions/checkout@v4

      - name: Build Android 14 r45 Pastel with Neoverse N1 JIT target
        run: bash experiments/160-swiftshader-perf/build-android-control.sh

      - name: Upload Pastel N1 artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-pastel-android14-r45-jit-neoverse-n1-run19
          path: experiments/160-swiftshader-perf/out-control/
          if-no-files-found: error
          retention-days: 1
