name: SwiftShader Android 14 Pastel control

on:
  push:
    branches: [vm-control]
    paths:
      - 'experiments/160-swiftshader-perf/**'
      - '.github/workflows/swiftshader-perf-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-control:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build stock Android 14 r45 Pastel control
        run: bash experiments/160-swiftshader-perf/build-android-control.sh

      - name: Upload Pastel control artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-pastel-android14-r45-stock-control
          path: experiments/160-swiftshader-perf/out-control/
          if-no-files-found: error
          retention-days: 1
