name: GitHub hosted runner service cgroup probe 26

on:
  push:
    branches:
      - vm-control
    paths:
      - .github/workflows/runner-service-cgroup-probe-26.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe hosted compute service cgroup
        shell: bash
        run: |
          set -euxo pipefail
          rel="$(awk -F: '$1 == "0" {print $3}' /proc/self/cgroup)"
          base="/sys/fs/cgroup${rel}"
          echo "cgroup_relative=$rel"
          echo "cgroup_base=$base"
          for f in memory.current memory.peak memory.high memory.max memory.swap.current memory.swap.peak memory.swap.max memory.events memory.pressure cpu.pressure pids.current pids.max; do
            if [ -r "$base/$f" ]; then echo "== $f =="; cat "$base/$f"; fi
          done
          systemctl show hosted-compute-agent.service -p MemoryCurrent -p MemoryPeak -p MemoryHigh -p MemoryMax -p MemorySwapMax || true
