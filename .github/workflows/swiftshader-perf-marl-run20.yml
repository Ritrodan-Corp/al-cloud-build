name: SwiftShader Android 14 Pastel Marl run 20

on:
  push:
    branches:
      - vm-control
    paths:
      - .github/workflows/swiftshader-perf-marl-run20.yml

permissions:
  contents: read

jobs:
  build-marl:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PASTEL_VARIANT: marl-worker-race
    steps:
      - uses: actions/checkout@v4

      - name: Build Android 14 r45 Pastel with Marl worker-race fix
        run: bash experiments/160-swiftshader-perf/build-android-control.sh

      - name: Upload Pastel Marl artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-pastel-android14-r45-marl-worker-race-run20
          path: experiments/160-swiftshader-perf/out-control/
          if-no-files-found: error
          retention-days: 1
