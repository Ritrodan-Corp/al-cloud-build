name: AL Cloud Pastel LLVM16 First Pass

on:
  push:
    branches:
      - pastel-llvm16-first-pass-20260928
    paths:
      - .github/workflows/al-cloud-pastel-llvm16-first-pass.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - id: mssa
            variant: aot-neoverse-n1-llvm16-retained-no-mr-mssa
          - id: slr
            variant: aot-neoverse-n1-llvm16-retained-no-mr-slr
          - id: nary
            variant: aot-neoverse-n1-llvm16-retained-no-mr-nary
          - id: instsimplify
            variant: aot-neoverse-n1-llvm16-retained-no-mr-instsimplify
          - id: consthoist
            variant: aot-neoverse-n1-llvm16-retained-no-mr-consthoist
          - id: licm
            variant: aot-neoverse-n1-llvm16-retained-no-mr-licm
          - id: looprotate
            variant: aot-neoverse-n1-llvm16-retained-no-mr-looprotate
          - id: lsr
            variant: aot-neoverse-n1-llvm16-retained-no-mr-lsr
    env:
      PASTEL_EXTRA_SWAP_GB: "8"
      PASTEL_DIAGNOSTICS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Validate builder
        run: bash -n experiments/160-swiftshader-perf/build-android-control.sh
      - name: Build isolated LLVM16 variant
        env:
          PASTEL_VARIANT: ${{ matrix.variant }}
        run: GITHUB_WORKSPACE="$PWD" bash experiments/160-swiftshader-perf/build-android-control.sh
      - name: Record candidate provenance
        if: success()
        run: |
          OUT=experiments/160-swiftshader-perf/out-control
          {
            echo "experiment=llvm16-retained-no-mr-first-pass-${{ matrix.id }}"
            echo "variant=${{ matrix.variant }}"
            echo "baseline_renderer_sha=1b2aed583c4430630296049d7a14b3eca51d20bfa0a73520ba73cdb98f4160fa"
            echo "source_branch=pastel-llvm16-first-pass-20260928"
            echo "source_commit=${GITHUB_SHA}"
            echo "one_factor=${{ matrix.id }}"
            cat "$OUT/llvm16-backend-provenance.txt"
          } > "$OUT/first-pass-provenance.txt"
      - name: Upload candidate artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pastel-llvm16-first-pass-${{ matrix.id }}-${{ github.sha }}
          path: experiments/160-swiftshader-perf/out-control/
          if-no-files-found: error
          retention-days: 7
