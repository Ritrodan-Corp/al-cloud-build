name: SwiftShader Android 14 Pastel diagnostic run 23

on:
  push:
    branches:
      - vm-control
    paths:
      - .github/workflows/swiftshader-perf-diagnostic-run23.yml

permissions:
  contents: read

jobs:
  build-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PASTEL_VARIANT: stock
      PASTEL_DIAGNOSTICS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Build stock Android 14 r45 Pastel with resource telemetry
        run: bash experiments/160-swiftshader-perf/build-android-control.sh

      - name: Upload Pastel diagnostic artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-pastel-android14-r45-diagnostic-run23
          path: experiments/160-swiftshader-perf/out-control/
          if-no-files-found: error
          retention-days: 1
