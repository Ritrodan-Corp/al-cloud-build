name: AL Cloud control-plane check

on:
  push:
    branches:
      - vm-control
    paths:
      - 'control-plane/**'
      - '.github/workflows/control-plane-check.yml'
  pull_request:
    paths:
      - 'control-plane/**'
      - '.github/workflows/control-plane-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: control-plane/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Wrangler dry run
        run: npm run check
