name: GitHub hosted runner cgroup probe 25

on:
  push:
    branches:
      - vm-control
    paths:
      - .github/workflows/runner-cgroup-probe-25.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe cgroup layout
        shell: bash
        run: |
          set -euxo pipefail
          cat /proc/self/cgroup
          cat /proc/mounts | grep -E 'cgroup| /sys/fs/cgroup ' || true
          find /sys/fs/cgroup -maxdepth 3 -type f -readable 2>/dev/null | sort | head -200 || true
          for f in             /sys/fs/cgroup/memory.current             /sys/fs/cgroup/memory.peak             /sys/fs/cgroup/memory.max             /sys/fs/cgroup/memory.events             /sys/fs/cgroup/memory/memory.usage_in_bytes             /sys/fs/cgroup/memory/memory.max_usage_in_bytes             /sys/fs/cgroup/memory/memory.limit_in_bytes             /sys/fs/cgroup/memory/memory.failcnt; do
            if [ -r "$f" ]; then echo "== $f =="; cat "$f"; fi
          done
