name: Publish MS MR repair2 artifacts

on:
  push:
    branches:
      - delegated-pastel-build-runner
    paths:
      - .github/workflows/publish-ms-mr-repair2.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: alcloud-ms-mr-repair2-20260921-1
      MS_ID: "10619245355"
      MS_SHA: "51a8b505f250c6f61b4e288f73e90f2a4f048508f8aad35003cb70c1af75b95a"
      MR_ID: "10618308884"
      MR_SHA: "96445cfd73bc0710acd05fcf9d1f8fd60e40a820f30985ac4621cfd04cd7b82d"
    steps:
      - name: Download and verify exact artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$MS_ID/zip" \
            -o release-assets/indvar-ms-repair2.zip
          echo "$MS_SHA  release-assets/indvar-ms-repair2.zip" | sha256sum -c -
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$MR_ID/zip" \
            -o release-assets/indvar-mr-repair2.zip
          echo "$MR_SHA  release-assets/indvar-mr-repair2.zip" | sha256sum -c -

      - name: Publish staging release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target delegated-pastel-build-runner \
              --title "AL Cloud MS MR repair2 staging" \
              --notes "Temporary staging bridge for verified MS/MR repair2 artifacts from workflow run 35550125817."
          fi
          gh release upload "$TAG" release-assets/indvar-ms-repair2.zip release-assets/indvar-mr-repair2.zip \
            --clobber --repo "$GITHUB_REPOSITORY"

      - name: Verify release
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,assets
