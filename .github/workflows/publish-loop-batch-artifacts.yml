name: Publish loop batch artifacts

on:
  push:
    branches:
      - delegated-pastel-build-runner
    paths:
      - .github/workflows/publish-loop-batch-artifacts.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: alcloud-loop-batch-20260920-1
    steps:
      - name: Download verified Actions artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10614276452/zip" \
            -o release-assets/looprotate.zip
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10613693782/zip" \
            -o release-assets/indvarsimplify.zip
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10614082003/zip" \
            -o release-assets/loopstrengthreduce.zip
          sha256sum release-assets/*.zip

      - name: Create or update public staging release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target delegated-pastel-build-runner \
              --title "AL Cloud loop batch staging" \
              --notes "Temporary public staging bridge for verified loop-transform build artifacts from workflow run 35537219049."
          fi
          gh release upload "$TAG" release-assets/*.zip --clobber --repo "$GITHUB_REPOSITORY"

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,assets
