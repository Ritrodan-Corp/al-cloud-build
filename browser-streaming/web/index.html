<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Azur Lane Cloud</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main id="stage" class="controls-visible" tabindex="0" aria-label="Azur Lane remote display">
    <div id="screen-wrap">
      <canvas id="screen" width="854" height="480" tabindex="0"></canvas>
      <img id="fallback" alt="Android screen fallback" draggable="false" tabindex="0" hidden>
    </div>

    <div id="hud" class="overlay">
      <span id="live-badge" class="badge">OFFLINE</span>
      <button id="launch" title="Launch Azur Lane">Launch</button>
      <button id="keyboard" title="Open text input">Keyboard</button>
      <button id="settings" title="Open Android settings">Settings</button>
      <button id="restart" title="Restart video stream">Reconnect</button>
    </div>

    <div id="nav" class="overlay" aria-label="Android navigation">
      <button data-key="4" title="Back" aria-label="Back">←</button>
      <button data-key="3" title="Home" aria-label="Home">●</button>
      <button data-key="187" title="Recents" aria-label="Recents">▢</button>
    </div>

    <div id="status-panel" class="overlay">
      <span id="status">Starting…</span>
      <span id="stats"></span>
    </div>

    <div id="text-panel" class="overlay" hidden>
      <input id="text" maxlength="256" placeholder="Type or paste text" autocomplete="off">
      <button id="send-text">Send</button>
      <button id="close-text" title="Close text input">×</button>
    </div>
  </main>

  <script type="module" src="/assets/app.js"></script>
</body>
</html>
