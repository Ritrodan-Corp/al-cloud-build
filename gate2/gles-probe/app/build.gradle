plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ritrodan.alcloud.gate2probe'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ritrodan.alcloud.gate2probe'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
